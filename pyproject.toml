[project]
name = "actadoc"
dynamic = ["version"]
description = "French document intelligence: OCR, calibrated NER, RAG with citations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: French",
]
dependencies = [
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
generation = ["faker>=25.0", "weasyprint>=62.0", "opencv-python>=4.10", "pillow>=10.3"]
ingestion = ["pdfplumber>=0.11", "pymupdf>=1.24", "python-doctr[torch]>=0.8", "pytesseract>=0.3.10"]
nlp = ["torch>=2.3", "transformers>=4.41", "scikit-learn>=1.5", "spacy>=3.7", "mlflow>=2.13"]
rag = ["sentence-transformers>=3.0", "psycopg[binary]>=3.1", "pgvector>=0.2.5", "llama-index>=0.10"]
llm = ["ollama>=0.2", "httpx>=0.27"]
anomalies = ["pypdf>=4.2", "imagehash>=4.3", "datasketch>=1.6"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=25.1",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# single source of truth for the version: src/actadoc/__init__.py
[tool.hatch.version]
path = "src/actadoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/actadoc"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: imports, B: bugbear, UP: pyupgrade, D: docstrings
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"]  # line length is handled by Black

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# test functions are documented by their name; module docstrings stay required
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["src/actadoc"]

[tool.coverage.report]
show_missing = true
skip_empty = true
