[project]
name = "actadoc"
version = "0.1.0"
description = "Intelligence documentaire francaise : OCR, NER calibree, RAG avec citations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
generation = ["faker>=25.0", "weasyprint>=62.0", "opencv-python>=4.10", "pillow>=10.3"]
ingestion = ["pdfplumber>=0.11", "pymupdf>=1.24", "python-doctr[torch]>=0.8", "pytesseract>=0.3.10"]
nlp = ["torch>=2.3", "transformers>=4.41", "scikit-learn>=1.5", "spacy>=3.7", "mlflow>=2.13"]
rag = ["sentence-transformers>=3.0", "psycopg[binary]>=3.1", "pgvector>=0.2.5", "llama-index>=0.10"]
llm = ["ollama>=0.2", "httpx>=0.27"]
anomalies = ["pypdf>=4.2", "imagehash>=4.3", "datasketch>=1.6"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actadoc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
